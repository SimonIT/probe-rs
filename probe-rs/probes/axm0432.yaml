name: axm0432
description: Axiom AXM-0432 JTAG wiring, e.g. on the Redbee Econotag (OpenOCD interface/ftdi/axm0432.cfg)
# The adapter uses the generic FT2232H VID/PID and product string, so it must be selected explicitly.
ftdi:
  layout_init:
    data: 0x0c08
    direction: 0x0c2b
  signals:
    ntrst:
      data: 0x0800 # ACBUS3
    nsrst:
      data: 0x0400 # ACBUS2
